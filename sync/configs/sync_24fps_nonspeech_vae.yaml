action: train_avsync_model_vae

# AudioVideoVAE config.yaml (contains video/audio VAE architecture params).
# May be left as "~" if `video_av_vae_config` AND `audio_av_vae_config` are
# both provided (per-modality split).
av_vae_config: "~"
# Optional per-modality config overrides. Each is a yaml in the same shape as
# `av_vae_config`; only the relevant section (`model.video` / `model.audio`)
# is consumed.  Missing modality falls back to `av_vae_config`.
video_av_vae_config: "~"
audio_av_vae_config: "~"
# Optional dedicated contrastive-head structural config. May be either a full
# av_vae-style yaml (whose `model.contrastive` is read) or a yaml whose
# top-level keys are already the contrastive params.  When set, contrastive
# head weights are kept at constructor-time random init regardless of
# init_contrastive_head_from_ckpt / load_contrastive_head_from_external.
contrastive_head_config: "~"
# Combined AudioVideoVAE checkpoint (video + audio VAE weights in one file)
vae_pretrained: "~"
# Optional: external video / audio VAE weights that override the corresponding
# sub-modules loaded from `vae_pretrained` above. When both are set, the
# combined ckpt only contributes the contrastive head.
video_vae_pretrained: "~"
audio_vae_pretrained: "~"
# When False, the contrastive head is trained alongside vproj/aproj/transformer.
freeze_contrastive_head: True
# When False, contrastive_head.* keys in `vae_pretrained` are ignored, and the
# contrastive head keeps its constructor-time random initialization.
init_contrastive_head_from_ckpt: True
# When True AND both `video_vae_pretrained` and `audio_vae_pretrained` are set,
# the contrastive head's video-only submodules are loaded from the video ckpt
# and the audio-only submodules from the audio ckpt (shared params like
# logit_scale are left as whatever `vae_pretrained` / random init produced).
# Set False to keep contrastive_head purely from `vae_pretrained`.
load_contrastive_head_from_external: True
# Synchformer checkpoint for resume / finetune
ckpt_path: "~"

model:
  target: omnivae_sync.model.sync_model_vae.SynchformerVAE
  params:
    av_vae_config: ${av_vae_config}
    video_av_vae_config: ${video_av_vae_config}
    audio_av_vae_config: ${audio_av_vae_config}
    contrastive_head_config: ${contrastive_head_config}
    vae_pretrained: ${vae_pretrained}
    video_vae_pretrained: ${video_vae_pretrained}
    audio_vae_pretrained: ${audio_vae_pretrained}
    freeze_contrastive_head: ${freeze_contrastive_head}
    init_contrastive_head_from_ckpt: ${init_contrastive_head_from_ckpt}
    load_contrastive_head_from_external: ${load_contrastive_head_from_external}
    source_vfps: 24   # matches data.target_fps; data pipeline already subsampled
    tail_extra_sec: ${data.tail_extra_sec}
    vproj:
      target: torch.nn.Linear
      params:
        in_features: 1   # auto-overridden by contrastive head video segment output dim
        out_features: ${model.params.transformer.params.n_embd}
    aproj:
      target: torch.nn.Linear
      params:
        in_features: 1   # auto-overridden by contrastive head audio segment output dim
        out_features: ${model.params.transformer.params.n_embd}
    transformer:
      target: omnivae_sync.model.sync_model.GlobalTransformer
      params:
        n_layer: 3
        n_head: 8
        n_embd: 768
        tok_pdrop: 0.0
        embd_pdrop: 0.1
        resid_pdrop: 0.1
        attn_pdrop: 0.1
        pos_emb_cfg:
          target: omnivae_sync.model.modules.transformer.RandInitPositionalEncoding
          params:
            # 1 (OFF) + S (video) + 1 (MOD) + S (audio); pos_emb truncated to actual seq_len
            block_shape: [100]
            n_embd: ${model.params.transformer.params.n_embd}
        off_head_cfg:
          target: torch.nn.Linear
          params:
            in_features: ${model.params.transformer.params.n_embd}
            out_features: ${data.num_off_cls}

training:
  base_learning_rate: 2e-6
  base_batch_size: 8
  num_workers: 8
  num_epochs: 1000
  patience: 20
  to_max_metric: True
  metric_name: 'accuracy_1'
  early_stop_phase: 'valid'
  use_half_precision: True
  seed: 1337
  compile: false
  skip_test: False
  run_test_only: False
  resume: False
  finetune: False
  dist_backend: 'nccl'
  max_clip_norm: 1
  lr_scheduler:
    name: 'constant_with_warmup'
    warmup: 1000
  optimizer:
    name: adam
    betas: [0.9, 0.999]
    momentum: 0.9
    weight_decay: 0

data:
  offset_type: 'grid'
  num_off_cls: 21
  prob_oos: null
  max_off_sec: 2
  crop_len_sec: 6
  tail_extra_sec: 0.0
  vids_path: ${oc.env:OMNIVAE_SYNC_VIDEOS,./data/videos}
  size_before_crop: 256
  input_size: 256
  vfps: 24             # native fps of source video files
  target_fps: 24       # subsample to this fps in data pipeline before transforms
  afps: 48000          # DAC sample rate (read from av_vae_config)
  do_offset: True
  do_preprocess: True
  p_color_jitter: 0.0
  p_gray_scale: 0.0
  sometimes_upscale_p: 0.0
  is_spatial_crop_random: True
  is_temporal_crop_random: True
  audio_jitter_sec: 0.05
  p_horizontal_flip: 0.5
  p_audio_aug: 0.0
  dataset:
    target: omnivae_sync.dataset.vggsound.VGGSound
    params:
      splits_path: ${oc.env:OMNIVAE_SYNC_SPLITS,./data}
      meta_path: ${oc.env:OMNIVAE_SYNC_VGGSOUND_META,./data/vggsound.csv}
      load_fixed_offsets_on: []
      vis_load_backend: 'read_video'
      size_ratio: null

# ----- Transform: no segment splitting, no mel spectrogram -----
transform_sequence_train:
  - target: omnivae_sync.dataset.transforms.EqualifyFromRight
    params:
      clip_max_len_sec: 10
  - target: omnivae_sync.dataset.transforms.RGBSpatialCropSometimesUpscale
    params:
      sometimes_p: ${data.sometimes_upscale_p}
      smaller_input_size: 192
      target_input_size: ${data.input_size}
      is_random: ${data.is_spatial_crop_random}
  - target: omnivae_sync.dataset.transforms.TemporalCropAndOffset
    params:
      crop_len_sec: ${data.crop_len_sec}
      max_off_sec: ${data.max_off_sec}
      max_wiggle_sec: ${data.audio_jitter_sec}
      do_offset: ${data.do_offset}
      offset_type: ${data.offset_type}
      prob_oos: ${data.prob_oos}
      grid_size: ${data.num_off_cls}
      vfps: ${data.target_fps}
      causal_extra_frames: 1
      tail_extra_sec: ${data.tail_extra_sec}
  - target: omnivae_sync.dataset.transforms.RandomApplyColorDistortion
    params:
      p_color_jitter: ${data.p_color_jitter}
      s: 1.0
      p_gray_scale: ${data.p_gray_scale}
  - target: omnivae_sync.dataset.transforms.RandomHorizontalFlip
    params:
      p: ${data.p_horizontal_flip}
  - target: omnivae_sync.dataset.transforms.AudioRandomReverb
    params:
      p: ${data.p_audio_aug}
  - target: omnivae_sync.dataset.transforms.AudioRandomVolume
    params:
      p: ${data.p_audio_aug}
      gain: 2.0
      gain_type: 'amplitude'
  - target: omnivae_sync.dataset.transforms.AudioRandomPitchShift
    params:
      p: ${data.p_audio_aug}
      shift: 1000
  - target: omnivae_sync.dataset.transforms.AudioRandomLowpassFilter
    params:
      p: ${data.p_audio_aug}
      cutoff_freq: 100
  - target: omnivae_sync.dataset.transforms.AudioRandomGaussNoise
    params:
      p: ${data.p_audio_aug}
      amplitude: 0.01
  - target: omnivae_sync.dataset.transforms.RGBToHalfToZeroOne
  - target: omnivae_sync.dataset.transforms.RGBNormalize
    params:
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
  - target: omnivae_sync.dataset.transforms.PermuteForVAE

transform_sequence_test:
  - target: omnivae_sync.dataset.transforms.EqualifyFromRight
  - target: omnivae_sync.dataset.transforms.RGBSpatialCrop
    params:
      input_size: ${data.input_size}
      is_random: False
  - target: omnivae_sync.dataset.transforms.TemporalCropAndOffset
    params:
      crop_len_sec: ${data.crop_len_sec}
      max_off_sec: ${data.max_off_sec}
      max_wiggle_sec: 0.0
      do_offset: ${data.do_offset}
      grid_size: ${data.num_off_cls}
      offset_type: ${data.offset_type}
      prob_oos: ${data.prob_oos}
      vfps: ${data.target_fps}
      causal_extra_frames: 1
      tail_extra_sec: ${data.tail_extra_sec}
  - target: omnivae_sync.dataset.transforms.RGBToHalfToZeroOne
  - target: omnivae_sync.dataset.transforms.RGBNormalize
    params:
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
  - target: omnivae_sync.dataset.transforms.PermuteForVAE

logging:
  logdir: ${oc.env:OMNIVAE_SYNC_EXP_ROOT,./outputs}/sync_models
  log_code_state: False
  log_frequency: 1
  patterns_to_ignore: ['logs', '.git', '__pycache__', 'data', '*.pt', 'sbatch_logs', '*.mp4', '*.wav', '*.jpg', '*.gif', 'misc*']
  vis_segment_sim: False
  log_max_items: 500000
  use_wandb: False
