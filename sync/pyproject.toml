[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivae-sync"
version = "0.1.0"
description = "Audio-video synchronization probing code for OmniVAE latent features."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "omnivae>=0.1.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "torchaudio>=2.1",
    "numpy>=1.24,<2.0",
    "omegaconf>=2.1",
    "einops>=0.7",
    "tqdm>=4.66",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tensorboard>=2.14",
    "wandb>=0.16",
    "timm>=0.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "debugpy>=1.8"]

[project.scripts]
omnivae-sync-train = "omnivae_sync.train:main"
omnivae-sync-predict = "omnivae_sync.infer.predict_offset:main_cli"
omnivae-sync-eval = "omnivae_sync.eval.evaluate:main_cli"

[tool.setuptools.packages.find]
exclude = ["configs*", "docs*", "scripts*", "outputs*", "tests*"]

[tool.wheel]
exclude = ["configs*", "docs*", "scripts*", "outputs*", "tests*"]
