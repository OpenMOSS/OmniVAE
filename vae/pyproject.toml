[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivae"
version = "0.1.0"
description = "Audio-video VAE training code for OmniVAE."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "torchaudio>=2.1",
    "numpy>=1.24,<2.0",
    "PyYAML>=6.0",
    "omegaconf>=2.1",
    "einops>=0.7",
    "tqdm>=4.66",
    "requests>=2.31",
    "decord>=0.6",
    "av>=11.0",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "diffusers>=0.30",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "sentencepiece>=0.1",
    "ftfy>=6.1",
    "regex>=2024.7",
    "lpips>=0.1.4",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["mypy==1.8.0", "pytest>=8.0", "debugpy>=1.8"]
metrics = [
    "pesq>=0.0.4",
    "pystoi>=0.4.1",
    "stopes>=2.3.0",
    "descript-audiotools>=0.7.2",
]
video = ["torchcodec>=0.1.0"]

[tool.setuptools.packages.find]
exclude = ["assets*", "docker*", "docs", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "docker*", "docs", "scripts*", "tests*"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_calls = false
check_untyped_defs = true
no_implicit_optional = true
