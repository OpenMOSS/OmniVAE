name: Update Star History

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  update-star-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate star history chart
        uses: narayann7/star-history-action@v1.0.4
        with:
          repos: OpenMOSS/OmniVAE
          type: Date
