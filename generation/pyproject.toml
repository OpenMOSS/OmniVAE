[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivae-generation"
version = "0.1.0"
description = "Downstream text-to-image, text-to-video, text-to-audio, and text-to-audio-video generation with OmniVAE tokenizers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "OmniVAE Contributors"}
]
dependencies = []

[tool.setuptools.packages.find]
include = ["omnivae_generation*"]
